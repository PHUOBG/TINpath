<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <h1>Biểu mẫu Đăng Ký</h1>
        <form action="">
            <p>
                <label for="username">Tên người dùng:</label>
                <input type="text" id="username" name="username" placeholder="Nhập tên của bạn" />
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Nhập email của bạn" />
            </p>

            <p>
                <label for="password">Mật khẩu:</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" />
            </p>

            <p>
                <label>Giới tính:</label>
                <input type="radio" name="gender" value="nam" id="nam" /><label for="nam"
                    >Nam</label
                >
                <input type="radio" name="gender" value="nu" id="nu" /><label for="nu">Nữ</label>
            </p>

            <p>
                <label for="birth-of-date">Ngày sinh:</label>
                <input type="date" name="birth-of-date" id="birth-of-date" />
            </p>

            <input type="submit" value="Đăng ký" />
        </form>
    </body>
</html>
