    <script>
      // Đảm bảo mặc định là chế độ sáng (Light mode)
      try {
        const theme = localStorage.getItem('tinpath_theme_mode');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        document.documentElement.classList.remove('dark');
      }
    </script>
